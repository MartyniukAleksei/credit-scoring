[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-scoring"
version = "0.1.0"
description = "Production tabular ML system — Phase 1 signature project"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "scikit-learn",
    "lightgbm",
    "shap",
    "fastapi",
    "pydantic",
    "uvicorn[standard]",
    "pandera",
    "optuna",
    "prefect",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "mypy",
]

[tool.mypy]
ignore_missing_imports = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "requires_data: нужен реальный DVC-датасет на диске (пропускается в CI)",
]